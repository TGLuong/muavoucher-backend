[package]
name = "muavoucher-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.21", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder", "hostname", "pool"] }
log = "0.4.29"
rand = "0.10.1"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = "1.1.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
test-log = "0.2.20"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["macros", "formatting"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "local-time"] }
uuid = { version = "1.23.1", features = ["v7"] }
